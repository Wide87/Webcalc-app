<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector Calculator: 3D Operations</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
colors: {
'primary-blue': '#2563EB', // Blue-600
'accent-cyan': '#06B6D4', // Cyan-500
'background-light': '#F8FAFC', // Slate-50
},
fontFamily: {
sans: ['Inter', 'sans-serif'],
mono: ['SFMono-Regular', 'Menlo', 'monospace'],
},
}
}
}
</script>
<style>
/* General styling for the body */
body {
background-color: #F8FAFC;
}
/* Custom styling for the input fields for a cleaner look */
.vector-input-group input {
@apply w-full px-3 py-2 border border-gray-300 rounded-lg text-center
focus:ring-primary-blue focus:border-primary-blue transition;
}
/* Style for the calculation buttons */
.calc-button {
@apply w-full py-3 rounded-xl shadow-lg font-semibold transition
duration-300 transform hover:scale-[1.02] active:scale-[0.98];
}
</style>
</head>
<body class="font-sans text-gray-800 p-4 md:p-8">
<div class="max-w-6xl mx-auto">
<header class="text-center py-6 mb-10 bg-white rounded-2xl shadow-xl
border-t-4 border-primary-blue">
<h1 class="text-4xl font-bold text-primary-blue">Vector Calculator
(3D)</h1>
<p class="text-xl text-gray-500 mt-2">Explore common vector operations:
$\mathbf{A}$, $\mathbf{B}$ and scalar $k$.</p>
</header>
<section class="mb-10 p-6 bg-white rounded-2xl shadow-xl">
<h2 class="text-2xl font-semibold mb-6 border-b pb-2 text-accent-
cyan">Input Vectors and Scalar</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-8 vector-input-group">
<div>
<label class="block text-lg font-medium mb-3 text-primary-
blue">Vector A (x, y, z)</label>
<div class="flex space-x-2">
<input type="number" id="Ax" value="3" placeholder="x">
<input type="number" id="Ay" value="1" placeholder="y">
<input type="number" id="Az" value="-2" placeholder="z">
</div>
</div>
<div>
<label class="block text-lg font-medium mb-3 text-primary-
blue">Vector B (x, y, z)</label>
<div class="flex space-x-2">
<input type="number" id="Bx" value="1" placeholder="x">
<input type="number" id="By" value="4" placeholder="y">
<input type="number" id="Bz" value="5" placeholder="z">
</div>
</div>
<div class="md:col-span-1 flex flex-col justify-end">
<div>
<label class="block text-lg font-medium mb-3 text-primary-
blue">Scalar $k$</label>
<input type="number" id="scalarK" value="2"
placeholder="k">
</div>
</div>
</div>
<button onclick="calculateAll()" class="mt-8 w-full calc-button bg-
primary-blue text-white hover:bg-primary-blue/90">
Run All Calculations
</button>
</section>
<section class="p-6 bg-white rounded-2xl shadow-xl">
<h2 class="text-2xl font-semibold mb-6 border-b pb-2 text-accent-
cyan">Calculation Results</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="bg-blue-50 p-4 rounded-xl border-l-4 border-primary-
blue shadow-sm">
<p class="text-lg font-mono mb-2 text-primary-blue">Vector
Addition</p>
<p id="resultAdd" class="text-3xl font-bold text-primary-blue">
</p>
<p class="text-sm text-primary-blue/70 mt-1">Result is a vector
(A + B).</p>
</div>
